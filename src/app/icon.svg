<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="favBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="75%" stop-color="#FAF6ED" />
      <stop offset="100%" stop-color="#F2E8D3" />
    </radialGradient>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#F3CA52" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>
    <linearGradient id="leafGrad1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1B5E20" />
      <stop offset="100%" stop-color="#388E3C" />
    </linearGradient>
    <linearGradient id="leafGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2E7D32" />
      <stop offset="100%" stop-color="#66BB6A" />
    </linearGradient>
  </defs>

  <!-- Background Circle Badge -->
  <circle cx="64" cy="64" r="60" fill="url(#favBg)" stroke="url(#favGold)" stroke-width="4" />
  <circle cx="64" cy="64" r="54" fill="none" stroke="#163820" stroke-width="1.2" stroke-dasharray="4 2" opacity="0.4" />

  <!-- Dual Leaf on top of 'n' -->
  <g transform="translate(64, 42)">
    <!-- Left Leaf -->
    <path d="M 0,0 C -5,-16 -24,-18 -30,-8 C -33,2 -14,5 0,0 Z" fill="url(#leafGrad1)" />
    <!-- Right Leaf -->
    <path d="M 2,-2 C 7,-18 26,-20 32,-10 C 35,0 16,3 2,-2 Z" fill="url(#leafGrad2)" />
    <path d="M 1,-1 C 8,-12 20,-10 28,-7" fill="none" stroke="#A5D6A7" stroke-width="1.2" />
  </g>

  <!-- Main 'n' lettermark in lowercase -->
  <g transform="translate(64, 82)">
    <text x="0" y="0" font-family="'Outfit', 'Poppins', 'Montserrat', -apple-system, sans-serif" font-size="44" font-weight="900" fill="#163820" text-anchor="middle" letter-spacing="-1">
      n
    </text>

    <!-- Golden Smile Arc Underneath -->
    <path d="M -30,12 C -10,22 10,22 30,12" fill="none" stroke="url(#favGold)" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
