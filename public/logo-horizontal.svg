<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 62" width="190" height="62">
  <defs>
    <linearGradient id="goldChandExact" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C58526" />
      <stop offset="50%" stop-color="#E0A43C" />
      <stop offset="100%" stop-color="#C58526" />
    </linearGradient>
  </defs>

  <g transform="translate(10, 6)">
    <!-- 'nut' in rich chocolate brown -->
    <text x="0" y="32" font-family="'Outfit', 'Poppins', 'Montserrat', -apple-system, sans-serif" font-size="38" font-weight="900" fill="#23160C" letter-spacing="-0.5px">
      nut
    </text>

    <!-- 'fl' in rich forest olive green -->
    <text x="60" y="32" font-family="'Outfit', 'Poppins', 'Montserrat', -apple-system, sans-serif" font-size="38" font-weight="900" fill="#1D4A22" letter-spacing="-0.5px">
      fl
    </text>

    <!-- 'ı' stem without dot -->
    <text x="90" y="32" font-family="'Outfit', 'Poppins', 'Montserrat', -apple-system, sans-serif" font-size="38" font-weight="900" fill="#1D4A22">
      ı
    </text>

    <!-- 'x' in rich forest olive green -->
    <text x="101" y="32" font-family="'Outfit', 'Poppins', 'Montserrat', -apple-system, sans-serif" font-size="38" font-weight="900" fill="#1D4A22" letter-spacing="-0.5px">
      x
    </text>

    <!-- Leaf cluster on 'i' matching the exact photo -->
    <g transform="translate(94, 9)">
      <!-- Left small leaf -->
      <path d="M 0,0 C -4,-8 -13,-9 -16,-3 C -18,3 -7,4 0,0 Z" fill="#1D4A22" />
      <!-- Center top leaf -->
      <path d="M 0,-1 C 0,-9 9,-13 13,-8 C 15,-3 6,-1 0,-1 Z" fill="#26612E" />
      <!-- Right large leaf -->
      <path d="M 2,-1 C 6,-10 18,-11 22,-5 C 24,2 11,3 2,-1 Z" fill="#1D4A22" />
    </g>

    <!-- TM in small uppercase -->
    <text x="127" y="11" font-family="'Inter', sans-serif" font-size="8.5" font-weight="800" fill="#23160C">TM</text>

    <!-- Golden Chand Curve exactly from 'u' to 'l' with thick middle and tapered ends -->
    <path d="M 27,37 C 45,50 68,50 86,37 C 68,45.5 45,45.5 27,37 Z" fill="url(#goldChandExact)" />
  </g>
</svg>
