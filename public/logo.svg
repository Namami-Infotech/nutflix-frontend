<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="40%" fy="40%">
      <stop offset="0%" stop-color="#FFFDF7" />
      <stop offset="70%" stop-color="#FAF3E3" />
      <stop offset="100%" stop-color="#EFE3CA" />
    </radialGradient>

    <!-- Gold Foil Gradient for Borders & Details -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="40%" stop-color="#AA7C11" />
      <stop offset="70%" stop-color="#E6CA65" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>

    <!-- Text Path for Top Curved Text -->
    <path id="textArcTop" d="M 90,250 A 160,160 0 1,1 410,250" />
    
    <!-- Text Path for Bottom Curved Text -->
    <path id="textArcBottom" d="M 85,250 A 165,165 0 0,0 415,250" />
    
    <!-- Soft Drop Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#3B1E08" flood-opacity="0.15"/>
    </filter>

    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2D1500" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Outer Shadow & Background Badge Circle -->
  <circle cx="250" cy="250" r="235" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="4" filter="url(#badgeShadow)" />
  <circle cx="250" cy="250" r="226" fill="none" stroke="#C89D42" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.6" />
  <circle cx="250" cy="250" r="218" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" />

  <!-- Inner Decorative Thin Ring -->
  <circle cx="250" cy="250" r="185" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.4" />

  <!-- TOP CURVED TEXT: PREMIUM QUALITY -->
  <text font-family="'Georgia', 'Times New Roman', serif" font-size="16" font-weight="bold" fill="#3B1E08" letter-spacing="4.5">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
      • PREMIUM QUALITY •
    </textPath>
  </text>

  <!-- DRY FRUITS ILLUSTRATION CLUSTER (Center Top) -->
  <g transform="translate(250, 152)" filter="url(#softShadow)">

    <!-- Leaves behind nuts -->
    <!-- Left Leaf -->
    <path d="M -30,-5 C -55,-35 -15,-50 -5,-25 C -5,-5 -15,-5 -30,-5 Z" fill="#2E5A36" />
    <path d="M -30,-5 C -42,-26 -16,-38 -5,-25" fill="none" stroke="#4A7C59" stroke-width="1.5" />
    <!-- Right Leaf -->
    <path d="M 25,-10 C 50,-40 20,-55 5,-28 C 5,-8 15,-8 25,-10 Z" fill="#3D7047" />
    <path d="M 25,-10 C 38,-30 18,-42 5,-28" fill="none" stroke="#5C9368" stroke-width="1.5" />

    <!-- ALMOND (Left Back) -->
    <g transform="translate(-25, -20) rotate(-22)">
      <path d="M 0,-32 C 18,-20 22,10 0,32 C -22,10 -18,-20 0,-32 Z" fill="#8B4513" stroke="#5C2C09" stroke-width="1" />
      <path d="M -2,-26 C 12,-15 15,8 0,26" fill="none" stroke="#A0522D" stroke-width="2" opacity="0.7" />
      <!-- Texture lines -->
      <path d="M -6,-10 C -2,0 -4,10 -8,18 M 2,-15 C 6,-5 4,8 2,20 M 8,-8 C 10,0 8,8 6,14" fill="none" stroke="#5C2C09" stroke-width="1" opacity="0.6" />
    </g>

    <!-- CASHEW (Center Front) -->
    <g transform="translate(-8, 5) rotate(10)">
      <path d="M -15,-18 C -5,-28 18,-25 22,-10 C 26,8 10,25 -8,22 C -22,19 -25,2 -18,-8 C -12,-15 -20,-10 -15,-18 Z" fill="#F5E1A4" stroke="#D4B06A" stroke-width="1.5" />
      <path d="M -10,-12 C -2,-20 12,-18 16,-6 C 19,8 6,18 -5,16" fill="none" stroke="#FFF5D6" stroke-width="3" opacity="0.8" />
    </g>

    <!-- PISTACHIO (Right Front - Shell & Kernel) -->
    <g transform="translate(26, -5) rotate(18)">
      <!-- Outer Shell Left Half -->
      <path d="M -12,-24 C -22,-10 -20,15 -8,25 C -2,22 -8,-5 -12,-24 Z" fill="#E8D8C8" stroke="#B8A490" stroke-width="1" />
      <!-- Outer Shell Right Half -->
      <path d="M 12,-24 C 22,-10 20,15 8,25 C 2,22 8,-5 12,-24 Z" fill="#DCC8B4" stroke="#B8A490" stroke-width="1" />
      <!-- Green Kernel Inside -->
      <path d="M -8,-20 C 0,-26 8,-20 9,-8 C 10,8 3,21 -6,21 C -11,18 -10,-8 -8,-20 Z" fill="#7C9D32" stroke="#556B2F" stroke-width="1" />
      <path d="M -3,-14 C 2,-18 6,-14 6,-5 C 6,5 2,14 -3,14" fill="none" stroke="#9ACD32" stroke-width="2" opacity="0.7" />
    </g>

    <!-- Front Little Leaf -->
    <path d="M -5,18 C -15,28 -30,22 -22,12 C -15,8 -8,12 -5,18 Z" fill="#4A7C59" />
  </g>

  <!-- MAIN BRAND LOGO TEXT: nutflix -->
  <g transform="translate(250, 260)">
    <!-- Brand Name with custom serif style and leaf on 'x' -->
    <text font-family="'Playfair Display', 'Georgia', 'Times New Roman', serif" font-size="64" font-weight="900" text-anchor="middle">
      <tspan fill="#3E1906" letter-spacing="-1">nut</tspan><tspan fill="#1E4D2B" letter-spacing="-1">flix</tspan>
    </text>
    
    <!-- Small Leaf accent over the 'x' -->
    <path d="M 105,-48 C 115,-62 128,-58 122,-46 C 116,-38 108,-42 105,-48 Z" fill="#2E5A36" />
    <path d="M 105,-48 C 114,-56 122,-52 122,-46" fill="none" stroke="#A8D5BA" stroke-width="1" />
    
    <!-- Dot on 'i' shaped as a little nut seed -->
    <ellipse cx="61" cy="-44" rx="4" ry="5.5" fill="#D4AF37" transform="rotate(15 61 -44)" />
  </g>

  <!-- SUBTITLE: - DRY FRUITS - -->
  <g transform="translate(250, 304)">
    <!-- Left Line -->
    <line x1="-150" y1="-5" x2="-80" y2="-5" stroke="#3E1906" stroke-width="1.5" />
    <circle cx="-77" cy="-5" r="2" fill="#C49A45" />

    <!-- Text -->
    <text font-family="'Cinzel', 'Georgia', serif" font-size="20" font-weight="bold" fill="#3E1906" letter-spacing="6" text-anchor="middle">
      DRY FRUITS
    </text>

    <!-- Right Line -->
    <circle cx="77" cy="-5" r="2" fill="#C49A45" />
    <line x1="80" y1="-5" x2="150" y2="-5" stroke="#3E1906" stroke-width="1.5" />
  </g>

  <!-- HEART & LEAVES ACCENT DECORATION -->
  <g transform="translate(250, 335)">
    <!-- Left Leaf -->
    <path d="M -32,-2 C -24,-10 -12,-6 -18,2 C -22,7 -28,4 -32,-2 Z" fill="#3D7047" />
    <!-- Heart -->
    <path d="M 0,6 C -1.5,4.5 -8,0 -8,-5 C -8,-9 -4.5,-11.5 0,-7.5 C 4.5,-11.5 8,-9 8,-5 C 8,0 1.5,4.5 0,6 Z" fill="none" stroke="#C49A45" stroke-width="2" stroke-linejoin="round" />
    <!-- Right Leaf -->
    <path d="M 32,-2 C 24,-10 12,-6 18,2 C 22,7 28,4 32,-2 Z" fill="#3D7047" />
    <!-- Fine side flourish lines -->
    <line x1="-60" y1="-2" x2="-38" y2="-2" stroke="#C49A45" stroke-width="1" />
    <line x1="38" y1="-2" x2="60" y2="-2" stroke="#C49A45" stroke-width="1" />
  </g>

  <!-- BOTTOM CURVED TEXT: NATURAL • HEALTHY • DELICIOUS -->
  <text font-family="'Georgia', 'Times New Roman', serif" font-size="14" font-weight="bold" fill="#3E1906" letter-spacing="4">
    <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">
      NATURAL • HEALTHY • DELICIOUS
    </textPath>
  </text>
</svg>
