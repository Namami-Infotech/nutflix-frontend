<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="emblemBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="75%" stop-color="#FAF6ED" />
      <stop offset="100%" stop-color="#F2E8D3" />
    </radialGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#F3CA52" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>
    <linearGradient id="leafGrad1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1B5E20" />
      <stop offset="100%" stop-color="#388E3C" />
    </linearGradient>
    <linearGradient id="leafGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2E7D32" />
      <stop offset="100%" stop-color="#66BB6A" />
    </linearGradient>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#163820" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Outer Circle Badge -->
  <circle cx="200" cy="200" r="185" fill="url(#emblemBg)" stroke="url(#goldBorder)" stroke-width="4" filter="url(#badgeShadow)" />
  <circle cx="200" cy="200" r="176" fill="none" stroke="#163820" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.4" />
  <circle cx="200" cy="200" r="170" fill="none" stroke="url(#goldBorder)" stroke-width="1" />

  <!-- Top Curved Title -->
  <path id="curveTop" d="M 75,200 A 125,125 0 1,1 325,200" fill="none" />
  <text font-family="'Outfit', 'Inter', sans-serif" font-size="12" font-weight="900" fill="#163820" letter-spacing="3.5">
    <textPath href="#curveTop" startOffset="50%" text-anchor="middle">
      PREMIUM DRY FRUITS
    </textPath>
  </text>

  <!-- Center Nuts Illustration -->
  <g transform="translate(200, 130) scale(0.95)">
    <!-- Almond -->
    <g transform="translate(-25, -10) rotate(-22)">
      <path d="M 0,-24 C 14,-15 17,8 0,24 C -17,8 -14,-15 0,-24 Z" fill="#8B4513" stroke="#5C2C09" stroke-width="1.5" />
      <path d="M -2,-18 C 8,-10 10,5 0,18" fill="none" stroke="#A0522D" stroke-width="1.5" opacity="0.8" />
    </g>
    <!-- Cashew -->
    <g transform="translate(-5, 8) rotate(10)">
      <path d="M -14,-16 C -5,-25 15,-22 19,-8 C 22,6 9,20 -5,18 C -18,16 -20,1 -15,-8 Z" fill="#F5E1A4" stroke="#D4B06A" stroke-width="1.5" />
      <path d="M -9,-10 C -2,-17 10,-15 14,-5" fill="none" stroke="#FFF5D6" stroke-width="2.5" opacity="0.9" />
    </g>
    <!-- Pistachio -->
    <g transform="translate(25, -2) rotate(18)">
      <path d="M -10,-20 C -18,-8 -16,12 -7,20 C -2,18 -7,-4 -10,-20 Z" fill="#E8D8C8" stroke="#B8A490" stroke-width="1" />
      <path d="M 10,-20 C 18,-8 16,12 7,20 C 2,18 7,-4 10,-20 Z" fill="#DCC8B4" stroke="#B8A490" stroke-width="1" />
      <path d="M -7,-16 C 0,-22 7,-16 8,-6 C 9,6 2,16 -5,16 Z" fill="#7C9D32" stroke="#556B2F" stroke-width="1" />
    </g>
  </g>

  <!-- Main Wordmark: nutflix in lowercase -->
  <g transform="translate(200, 235)">
    <text x="0" y="0" font-family="'Outfit', 'Poppins', 'Montserrat', 'Inter', -apple-system, sans-serif" font-size="52" font-weight="900" fill="#163820" letter-spacing="-0.5" text-anchor="middle">
      nutfl<tspan fill="#163820">ı</tspan>x
    </text>

    <!-- TM mark -->
    <text x="86" y="-28" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#163820" opacity="0.85">TM</text>

    <!-- Dual Leaf on 'i' -->
    <g transform="translate(42, -26)">
      <!-- Left Leaf -->
      <path d="M 0,0 C -3,-10 -15,-12 -19,-6 C -21,1 -9,3 0,0 Z" fill="url(#leafGrad1)" />
      <!-- Right Leaf -->
      <path d="M 1,-1 C 4,-11 16,-14 20,-7 C 22,0 10,2 1,-1 Z" fill="url(#leafGrad2)" />
    </g>

    <!-- Golden Smile Underline -->
    <path d="M -72,10 C -25,26 35,26 78,10" fill="none" stroke="url(#goldBorder)" stroke-width="4" stroke-linecap="round" />

    <!-- Tagline -->
    <text x="0" y="32" font-family="'Outfit', 'Inter', sans-serif" font-size="9.5" font-weight="800" fill="#163820" letter-spacing="2" text-anchor="middle" opacity="0.9">
      PURE NUTRITION. PREMIUM TASTE.
    </text>
  </g>

  <!-- Bottom Curved Slogan -->
  <path id="curveBottom" d="M 75,200 A 125,125 0 0,0 325,200" fill="none" />
  <text font-family="'Outfit', 'Inter', sans-serif" font-size="11" font-weight="800" fill="#AA7C11" letter-spacing="2.5">
    <textPath href="#curveBottom" startOffset="50%" text-anchor="middle">
      ★ 100% NATURAL & FRESH ★
    </textPath>
  </text>
</svg>
