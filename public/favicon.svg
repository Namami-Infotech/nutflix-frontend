<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="favBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFDF7" />
      <stop offset="75%" stop-color="#FAF3E3" />
      <stop offset="100%" stop-color="#EBE0C7" />
    </radialGradient>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#AA7C11" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>
  </defs>

  <!-- Circular Badge -->
  <circle cx="64" cy="64" r="60" fill="url(#favBg)" stroke="url(#favGold)" stroke-width="4" />
  <circle cx="64" cy="64" r="54" fill="none" stroke="#C89D42" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.7" />

  <!-- Dry Fruits & Leaf Symbol (Center Top) -->
  <g transform="translate(64, 46) scale(0.95)">
    <!-- Leaves -->
    <path d="M -18,-6 C -38,-28 -5,-38 0,-18 C 0,-4 -10,-4 -18,-6 Z" fill="#2E5A36" />
    <path d="M 15,-8 C 35,-30 8,-40 0,-20 C 0,-6 8,-6 15,-8 Z" fill="#3D7047" />

    <!-- Almond -->
    <g transform="translate(-16, -12) rotate(-22)">
      <path d="M 0,-24 C 14,-15 17,8 0,24 C -17,8 -14,-15 0,-24 Z" fill="#8B4513" stroke="#5C2C09" stroke-width="1" />
    </g>

    <!-- Cashew -->
    <g transform="translate(-5, 6) rotate(10)">
      <path d="M -12,-14 C -4,-22 14,-20 17,-8 C 20,6 8,18 -6,16 C -17,14 -19,1 -14,-6 Z" fill="#F5E1A4" stroke="#D4B06A" stroke-width="1.2" />
    </g>

    <!-- Pistachio -->
    <g transform="translate(18, -4) rotate(18)">
      <path d="M -9,-18 C -16,-7 -15,11 -6,18 C -1,16 -6,-3 -9,-18 Z" fill="#E8D8C8" />
      <path d="M 9,-18 C 16,-7 15,11 6,18 C 1,16 6,-3 9,-18 Z" fill="#DCC8B4" />
      <path d="M -6,-15 C 0,-19 6,-15 7,-6 C 7,6 2,15 -5,15 Z" fill="#7C9D32" />
    </g>
  </g>

  <!-- Big Stylized 'N' or 'nutflix' Icon Text -->
  <g transform="translate(64, 96)">
    <text font-family="'Playfair Display', 'Georgia', serif" font-size="28" font-weight="900" text-anchor="middle">
      <tspan fill="#3E1906">n</tspan><tspan fill="#1E4D2B">f</tspan>
    </text>
  </g>
</svg>
